[build-system]
requires = ["setuptools>=72.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sichuan-weather-pipeline"
version = "0.1.0"
description = "A reproducible, offline-capable Python pipeline for cleaning, validating, summarizing, and visualizing weather-forecast snapshot data."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = [
    "Pillow>=11,<13",
    "pytest>=8.3,<9",
]
reproducibility = [
    "build>=1.2,<2",
    "packaging>=24,<27",
    "pip>=25,<27",
    "pip-tools>=7.4,<8",
    "setuptools>=72.1,<82",
    "wheel>=0.45,<1",
]

[project.scripts]
weather-pipeline = "sichuan_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
